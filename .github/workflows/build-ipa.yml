name: Build unsigned IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project NoodoeProbe.xcodeproj \
            -scheme NoodoeProbe \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/NoodoeProbe.app Payload/
          zip -qry NoodoeProbe-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: NoodoeProbe-unsigned-ipa
          path: NoodoeProbe-unsigned.ipa

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NoodoeProbe-unsigned.ipa
